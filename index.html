<!doctype html>
<html lang="en" data-resolution="portrait" data-composition-variables='[{"id":"claim","type":"string","label":"End card line","default":"Know where your money is going"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Acme Budget — 30s promo</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>

      :root {
        --ground: #0f0f13;
        --surface: #1c1c22;
        --ink: #ebecef;
        --accent: #7986cb;
        --highlight: #a5afe6;
        --flood: #5c6bc0;
        --bezel: #1c1c22;
        --bezel_edge: #2a2a33;
        --font-display: "Montserrat", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); font-family: var(--font-display); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      #ground { position: absolute; inset: 0; background: var(--ground); }
      #root > [data-composition-src] { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1080" data-height="1920">
      <div id="ground"></div>

      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-track-kind="graphics" data-start="0" data-duration="4" data-track-index="1" data-width="1080" data-height="1920" style="z-index: 1"></div>
      <div id="reveal" data-composition-id="reveal" data-composition-src="compositions/reveal.html" data-track-kind="graphics" data-start="4" data-duration="3" data-track-index="1" data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="track" data-composition-id="track" data-composition-src="compositions/track.html" data-track-kind="graphics" data-start="7" data-duration="6" data-track-index="1" data-width="1080" data-height="1920" style="z-index: 3"></div>
      <div id="insights" data-composition-id="insights" data-composition-src="compositions/insights.html" data-track-kind="graphics" data-start="13" data-duration="6" data-track-index="1" data-width="1080" data-height="1920" style="z-index: 4"></div>
      <div id="budgets" data-composition-id="budgets" data-composition-src="compositions/budgets.html" data-track-kind="graphics" data-start="18.8" data-duration="6.2" data-track-index="2" data-width="1080" data-height="1920" style="z-index: 5"></div>
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html" data-track-kind="graphics" data-start="24.6" data-duration="5.4" data-track-index="2" data-width="1080" data-height="1920" style="z-index: 6"></div>

      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-track-kind="captions" data-start="0" data-duration="30" data-track-index="3" data-width="1080" data-height="1920" style="z-index: 9"></div>

      <!-- UI sounds: bundled HyperFrames library (CC0); each placed so its peak lands one frame after the picture -->
      <audio id="sfx01" class="clip" src="assets/sfx/pop.mp3" data-start="0.313" data-duration="0.72" data-volume="1.0" data-track-index="8"></audio>
      <audio id="sfx02" class="clip" src="assets/sfx/click.mp3" data-start="0.76" data-duration="0.37" data-volume="0.9" data-track-index="7"></audio>

      <audio id="sfx05" class="clip" src="assets/sfx/pop.mp3" data-start="4.063" data-duration="0.72" data-volume="1.0" data-track-index="8"></audio>
      <audio id="sfx06" class="clip" src="assets/sfx/whoosh.mp3" data-start="7.171" data-duration="0.58" data-volume="0.4" data-track-index="7"></audio>
      <audio id="sfx07" class="clip" src="assets/sfx/whoosh.mp3" data-start="8.671" data-duration="0.58" data-volume="0.5" data-track-index="8"></audio>
      <audio id="sfx08" class="clip" src="assets/sfx/click.mp3" data-start="9.96" data-duration="0.37" data-volume="0.9" data-track-index="7"></audio>

      <audio id="sfx10" class="clip" src="assets/sfx/whoosh.mp3" data-start="14.471" data-duration="0.58" data-volume="0.4" data-track-index="7"></audio>
      <audio id="sfx11" class="clip" src="assets/sfx/click.mp3" data-start="15.26" data-duration="0.37" data-volume="0.9" data-track-index="8"></audio>
      <audio id="sfx12" class="clip" src="assets/sfx/whoosh.mp3" data-start="18.671" data-duration="0.58" data-volume="0.5" data-track-index="7"></audio>
      <audio id="sfx13" class="clip" src="assets/sfx/click.mp3" data-start="19.76" data-duration="0.37" data-volume="0.9" data-track-index="8"></audio>
      <audio id="sfx14" class="clip" src="assets/sfx/notification.mp3" data-start="21.304" data-duration="2.46" data-volume="0.6" data-track-index="7"></audio>
      <audio id="sfx15" class="clip" src="assets/sfx/click.mp3" data-start="21.86" data-duration="0.37" data-volume="0.9" data-track-index="8"></audio>
      <audio id="sfx16" class="clip" src="assets/sfx/whoosh.mp3" data-start="24.471" data-duration="0.58" data-volume="0.5" data-track-index="7"></audio>

      <audio id="sfx19" class="clip" src="assets/sfx/pop.mp3" data-start="27.913" data-duration="0.72" data-volume="1.0" data-track-index="8"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
